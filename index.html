<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Neon Hand Motion</title>

    <!-- MEDIA PIPE -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js"></script>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
            font-family: Arial, sans-serif;
        }

        /* ==============================
           KAMERA
        ============================== */

        #video {
            position: fixed;
            inset: 0;

            width: 100%;
            height: 100%;

            object-fit: cover;

            transform: scaleX(-1);

            filter:
                brightness(0.38)
                contrast(1.3)
                saturate(1.2);

            z-index: 1;
        }


        /* ==============================
           CANVAS
        ============================== */

        #canvas {
            position: fixed;
            inset: 0;

            width: 100%;
            height: 100%;

            transform: scaleX(-1);

            z-index: 2;

            pointer-events: none;
        }


        /* ==============================
           OVERLAY
        ============================== */

        .overlay {
            position: fixed;
            inset: 0;

            z-index: 3;

            pointer-events: none;

            background:
                radial-gradient(
                    circle at center,
                    rgba(0,255,255,0.08),
                    rgba(0,0,0,0.35) 40%,
                    rgba(0,0,0,0.85) 100%
                );
        }


        /* ==============================
           JUDUL
        ============================== */

        .title {
            position: fixed;

            top: 25px;
            left: 50%;

            transform: translateX(-50%);

            z-index: 10;

            color: white;

            font-size: clamp(22px, 4vw, 42px);

            font-weight: bold;

            letter-spacing: 6px;

            text-align: center;

            text-shadow:
                0 0 5px #00ffff,
                0 0 15px #00ffff,
                0 0 30px #0088ff,
                0 0 60px #0088ff;
        }


        /* ==============================
           STATUS
        ============================== */

        #status {
            position: fixed;

            top: 82px;
            left: 50%;

            transform: translateX(-50%);

            z-index: 10;

            color: white;

            font-size: 13px;

            letter-spacing: 2px;

            text-align: center;

            text-shadow:
                0 0 5px #00ffff,
                0 0 10px #00ffff;
        }


        /* ==============================
           PESAN
        ============================== */

        #message {
            position: fixed;

            left: 50%;
            top: 50%;

            transform:
                translate(-50%, -50%)
                scale(0.6);

            width: 90%;

            z-index: 8;

            text-align: center;

            color: white;

            font-size: clamp(35px, 7vw, 90px);

            font-weight: 900;

            letter-spacing: 4px;

            opacity: 0;

            pointer-events: none;

            transition:
                opacity 0.35s ease,
                transform 0.35s ease;

            text-shadow:
                0 0 5px #00ffff,
                0 0 10px #00ffff,
                0 0 20px #00ffff,
                0 0 40px #0088ff,
                0 0 80px #0055ff;
        }


        #message.show {
            opacity: 1;

            transform:
                translate(-50%, -50%)
                scale(1);
        }


        #message.hide {
            opacity: 0;

            transform:
                translate(-50%, -50%)
                scale(0.6);
        }


        /* ==============================
           PARTIKEL HTML
        ============================== */

        .particle {
            position: fixed;

            width: 5px;
            height: 5px;

            border-radius: 50%;

            background: #00ffff;

            box-shadow:
                0 0 5px #00ffff,
                0 0 10px #00ffff,
                0 0 20px #0088ff;

            z-index: 6;

            pointer-events: none;

            animation:
                particleMove 1.2s linear forwards;
        }


        @keyframes particleMove {

            0% {
                opacity: 1;

                transform:
                    translate(0, 0)
                    scale(1);
            }

            100% {
                opacity: 0;

                transform:
                    translate(
                        var(--moveX),
                        var(--moveY)
                    )
                    scale(0);
            }

        }


        /* ==============================
           TOMBOL MUSIK
        ============================== */

        #musicBtn {
            position: fixed;

            right: 20px;
            bottom: 20px;

            z-index: 20;

            padding: 12px 18px;

            border-radius: 30px;

            border: 1px solid #00ffff;

            background:
                rgba(0,0,0,0.65);

            color: white;

            cursor: pointer;

            box-shadow:
                0 0 8px #00ffff,
                inset 0 0 8px rgba(0,255,255,0.2);

            transition: 0.3s;
        }


        #musicBtn:hover {
            box-shadow:
                0 0 15px #00ffff,
                0 0 30px #0088ff;
        }


        /* ==============================
           PETUNJUK
        ============================== */

        .instruction {
            position: fixed;

            bottom: 25px;
            left: 50%;

            transform: translateX(-50%);

            z-index: 10;

            color: rgba(255,255,255,0.7);

            font-size: 12px;

            letter-spacing: 2px;

            text-align: center;
        }


        /* ==============================
           RESPONSIVE
        ============================== */

        @media(max-width:600px) {

            .title {
                top: 18px;
                letter-spacing: 3px;
            }

            #status {
                top: 60px;
                font-size: 10px;
            }

            #message {
                font-size: 36px;
                letter-spacing: 2px;
            }

            .instruction {
                bottom: 70px;
                font-size: 10px;
            }

            #musicBtn {
                right: 10px;
                bottom: 15px;
                padding: 10px 13px;
                font-size: 11px;
            }

        }

    </style>

</head>

<body>


    <!-- =====================================
         VIDEO KAMERA
    ====================================== -->

    <video
        id="video"
        autoplay
        muted
        playsinline>
    </video>


    <!-- =====================================
         CANVAS
    ====================================== -->

    <canvas id="canvas"></canvas>


    <!-- =====================================
         OVERLAY
    ====================================== -->

    <div class="overlay"></div>


    <!-- =====================================
         JUDUL
    ====================================== -->

    <div class="title">
        NEON HAND MOTION
    </div>


    <!-- =====================================
         STATUS
    ====================================== -->

    <div id="status">
        MENGAKTIFKAN KAMERA...
    </div>


    <!-- =====================================
         PESAN
    ====================================== -->

    <div id="message"></div>


    <!-- =====================================
         PETUNJUK
    ====================================== -->

    <div class="instruction">
        ✋ Gerakkan tangan untuk memunculkan pesan ✨
    </div>


    <!-- =====================================
         MUSIK
    ====================================== -->

    <button id="musicBtn">
        🎵 Putar Musik
    </button>


    <script>

        /* =================================================
           ELEMENT
        ================================================= */

        const video =
            document.getElementById("video");

        const canvas =
            document.getElementById("canvas");

        const ctx =
            canvas.getContext("2d");

        const message =
            document.getElementById("message");

        const status =
            document.getElementById("status");

        const musicBtn =
            document.getElementById("musicBtn");


        /* =================================================
           CANVAS
        ================================================= */

        function resizeCanvas() {

            canvas.width =
                window.innerWidth;

            canvas.height =
                window.innerHeight;

        }

        resizeCanvas();

        window.addEventListener(
            "resize",
            resizeCanvas
        );


        /* =================================================
           DAFTAR PESAN
        ================================================= */

        const messages = [

            "I LOVE YOU ❤️",

            "YOU ARE SPECIAL ✨",

            "KEEP SMILING 😊",

            "NEVER GIVE UP 🔥",

            "YOU CAN DO IT ⚡",

            "STAY AWESOME 💙",

            "BELIEVE IN YOURSELF 🌟",

            "FOLLOW YOUR DREAMS 💫"

        ];


        let messageIndex = 0;


        /* =================================================
           STATUS GERAKAN
        ================================================= */

        let handDetected = false;

        let lastX = null;

        let lastY = null;

        let lastChange = 0;


        /* =================================================
           TAMPILKAN PESAN
        ================================================= */

        function showMessage() {

            message.classList.remove("show");

            message.classList.add("hide");


            setTimeout(() => {

                message.textContent =
                    messages[messageIndex];


                messageIndex++;

                if (
                    messageIndex >=
                    messages.length
                ) {

                    messageIndex = 0;

                }


                message.classList.remove("hide");

                message.classList.add("show");

            }, 200);

        }


        /* =================================================
           SEMBUNYIKAN PESAN
        ================================================= */

        function hideMessage() {

            message.classList.remove("show");

            message.classList.add("hide");

        }


        /* =================================================
           PARTIKEL
        ================================================= */

        function createParticle(x, y) {

            const particle =
                document.createElement("div");

            particle.className =
                "particle";


            particle.style.left =
                x + "px";


            particle.style.top =
                y + "px";


            const moveX =
                (Math.random() - 0.5) * 180;


            const moveY =
                (Math.random() - 0.5) * 180;


            particle.style.setProperty(
                "--moveX",
                moveX + "px"
            );


            particle.style.setProperty(
                "--moveY",
                moveY + "px"
            );


            document.body.appendChild(
                particle
            );


            setTimeout(() => {

                particle.remove();

            }, 1200);

        }


        /* =================================================
           BANYAK PARTIKEL
        ================================================= */

        function createParticles(
            x,
            y,
            jumlah = 5
        ) {

            for (
                let i = 0;
                i < jumlah;
                i++
            ) {

                createParticle(

                    x +
                    (Math.random() - 0.5) * 50,

                    y +
                    (Math.random() - 0.5) * 50

                );

            }

        }


        /* =================================================
           MEDIAPIPE
        ================================================= */

        const hands =
            new Hands({

                locateFile:
                    function(file) {

                        return (
                            "https://cdn.jsdelivr.net/npm/@mediapipe/hands/" +
                            file
                        );

                    }

            });


        hands.setOptions({

            maxNumHands: 2,

            modelComplexity: 1,

            minDetectionConfidence: 0.55,

            minTrackingConfidence: 0.55

        });


        /* =================================================
           HASIL DETEKSI TANGAN
        ================================================= */

        hands.onResults(
            function(results) {


                /* =========================================
                   BERSIHKAN CANVAS
                ========================================= */

                ctx.clearRect(
                    0,
                    0,
                    canvas.width,
                    canvas.height
                );


                /* =========================================
                   GAMBAR KAMERA
                ========================================= */

                if (results.image) {

                    ctx.drawImage(

                        results.image,

                        0,
                        0,

                        canvas.width,
                        canvas.height

                    );

                }


                /* =========================================
                   CEK TANGAN
                ========================================= */

                if (

                    results.multiHandLandmarks &&

                    results.multiHandLandmarks.length > 0

                ) {


                    /* =====================================
                       TANGAN BARU TERDETEKSI
                    ===================================== */

                    if (!handDetected) {

                        handDetected = true;

                        lastX = null;

                        lastY = null;

                        showMessage();

                    }


                    status.textContent =
                        "✋ TANGAN TERDETEKSI";

                    status.style.color =
                        "#00ffff";


                    /* =====================================
                       LOOP SETIAP TANGAN
                    ===================================== */

                    for (

                        const landmarks

                        of
                        results.multiHandLandmarks

                    ) {


                        /* =================================
                           GARIS TANGAN
                        ================================= */

                        drawConnectors(

                            ctx,

                            landmarks,

                            HAND_CONNECTIONS,

                            {

                                color: "#00ffff",

                                lineWidth: 4

                            }

                        );


                        /* =================================
                           TITIK JARI
                        ================================= */

                        drawLandmarks(

                            ctx,

                            landmarks,

                            {

                                color: "#ffffff",

                                fillColor: "#00ffff",

                                lineWidth: 2,

                                radius: 5

                            }

                        );


                        /* =================================
                           JARI TELUNJUK
                           LANDMARK 8
                        ================================= */

                        const finger =
                            landmarks[8];


                        const x =
                            finger.x *
                            canvas.width;


                        const y =
                            finger.y *
                            canvas.height;


                        /* =================================
                           LINGKARAN DI UJUNG JARI
                        ================================= */

                        ctx.beginPath();


                        ctx.arc(

                            x,

                            y,

                            20,

                            0,

                            Math.PI * 2

                        );


                        ctx.strokeStyle =
                            "#00ffff";


                        ctx.lineWidth = 3;


                        ctx.shadowColor =
                            "#00ffff";


                        ctx.shadowBlur = 25;


                        ctx.stroke();


                        ctx.shadowBlur = 0;


                        /* =================================
                           PARTIKEL SAAT TANGAN BERGERAK
                        ================================= */

                        if (

                            lastX !== null &&

                            lastY !== null

                        ) {


                            const distance =

                                Math.sqrt(

                                    Math.pow(
                                        x - lastX,
                                        2
                                    )

                                    +

                                    Math.pow(
                                        y - lastY,
                                        2
                                    )

                                );


                            /* =============================
                               TANGAN BENAR-BENAR BERGERAK
                            ============================= */

                            if (distance > 5) {

                                const jumlah =

                                    Math.min(

                                        15,

                                        Math.max(

                                            3,

                                            Math.floor(
                                                distance / 4
                                            )

                                        )

                                    );


                                createParticles(

                                    x,

                                    y,

                                    jumlah

                                );


                                /* =============================
                                   GANTI PESAN BERDASARKAN GERAKAN
                                ============================= */

                                const now =
                                    Date.now();


                                if (

                                    distance > 45 &&

                                    now -
                                    lastChange
                                    > 1200

                                ) {

                                    showMessage();

                                    lastChange =
                                        now;

                                }

                            }

                        }


                        /* =================================
                           SIMPAN POSISI SEBELUMNYA
                        ================================= */

                        lastX = x;

                        lastY = y;

                    }

                }


                /* =========================================
                   TANGAN TIDAK TERDETEKSI
                ========================================= */

                else {

                    if (handDetected) {

                        handDetected = false;

                        lastX = null;

                        lastY = null;

                        hideMessage();

                    }


                    status.textContent =
                        "👋 Arahkan tangan ke kamera";

                    status.style.color =
                        "#ffffff";

                }

            }
        );


        /* =================================================
           CAMERA
        ================================================= */

        const camera =
            new Camera(

                video,

                {

                    onFrame:
                        async function() {

                            await hands.send({

                                image: video

                            });

                        },


                    width: 1280,

                    height: 720

                }

            );


        /* =================================================
           START CAMERA
        ================================================= */

        async function startCamera() {

            try {

                await navigator
                    .mediaDevices
                    .getUserMedia({

                        video: true

                    })
                    .then(
                        stream => {

                            stream
                                .getTracks()
                                .forEach(
                                    track =>
                                        track.stop()
                                );

                        }
                    );


                camera.start();


                status.textContent =
                    "KAMERA AKTIF — ARAHKAN TANGAN";


            }

            catch (error) {

                console.error(error);


                status.textContent =
                    "❌ IZINKAN AKSES KAMERA";


                status.style.color =
                    "#ff4444";

            }

        }


        startCamera();


        /* =================================================
           MUSIK
        ================================================= */

        const music =
            new Audio("musik.mp3");


        music.loop = true;

        music.volume = 0.7;

        music.preload = "auto";


        /* =================================================
           PUTAR MUSIK
        ================================================= */

        async function playMusic() {

            try {

                await music.play();

                musicBtn.textContent =
                    "⏸️ Matikan Musik";

            }

            catch (error) {

                console.log(
                    "Autoplay diblokir browser."
                );

                musicBtn.textContent =
                    "🎵 Putar Musik";

            }

        }


        /* =================================================
           COBA AUTOPLAY
        ================================================= */

        window.addEventListener(
            "load",
            function() {

                playMusic();

            }
        );


        /* =================================================
           KLIK PERTAMA
        ================================================= */

        document.addEventListener(

            "click",

            function() {

                if (music.paused) {

                    playMusic();

                }

            },

            {
                once: true
            }

        );


        /* =================================================
           TOMBOL MUSIK
        ================================================= */

        musicBtn.addEventListener(

            "click",

            function(event) {

                event.stopPropagation();


                if (music.paused) {

                    playMusic();

                }

                else {

                    music.pause();

                    musicBtn.textContent =
                        "🎵 Putar Musik";

                }

            }

        );

    </script>

</body>
</html>
