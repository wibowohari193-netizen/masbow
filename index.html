<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Masbow Hand Motion</title>
    <link rel="icon" href="data:,">

    <!-- MediaPipe -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
            font-family: Arial, sans-serif;
        }

        #video {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(-1);

            filter:
                brightness(0.35)
                contrast(1.3)
                saturate(1.2);

            z-index: 1;
        }

        #canvas {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            transform: scaleX(-1);
            z-index: 2;
            pointer-events: none;
        }

        .overlay {
            position: fixed;
            inset: 0;
            z-index: 3;
            pointer-events: none;

            background:
                radial-gradient(
                    circle at center,
                    rgba(0,255,255,0.08),
                    rgba(0,0,0,0.35) 45%,
                    rgba(0,0,0,0.9)
                );
        }

        .title {
            position: fixed;
            top: 25px;
            left: 50%;
            transform: translateX(-50%);

            z-index: 10;

            color: white;
            font-size: clamp(22px, 4vw, 42px);
            font-weight: bold;
            letter-spacing: 6px;
            text-align: center;

            text-shadow:
                0 0 5px #00ffff,
                0 0 15px #00ffff,
                0 0 30px #0088ff,
                0 0 60px #0088ff;
        }

        #status {
            position: fixed;
            top: 82px;
            left: 50%;
            transform: translateX(-50%);

            z-index: 10;

            color: white;
            font-size: 13px;
            letter-spacing: 2px;
            text-align: center;

            text-shadow:
                0 0 5px #00ffff,
                0 0 10px #00ffff;
        }

        #gestureInfo {
            position: fixed;
            top: 110px;
            left: 50%;
            transform: translateX(-50%);

            z-index: 10;

            color: rgba(255,255,255,0.75);
            font-size: 11px;
            letter-spacing: 1px;
            text-align: center;
        }

        #message {
            position: fixed;

            left: 50%;
            top: 50%;

            transform:
                translate(-50%, -50%)
                scale(0.5);

            width: 92%;

            z-index: 8;

            text-align: center;

            color: white;

            font-size: clamp(32px, 7vw, 90px);

            font-weight: 900;

            letter-spacing: 3px;

            opacity: 0;

            pointer-events: none;

            transition:
                opacity 0.4s ease,
                transform 0.4s ease;

            text-shadow:
                0 0 5px #00ffff,
                0 0 10px #00ffff,
                0 0 20px #00ffff,
                0 0 40px #0088ff,
                0 0 80px #0055ff;
        }

        #message.show {
            opacity: 1;

            transform:
                translate(-50%, -50%)
                scale(1);
        }

        #message.hide {
            opacity: 0;

            transform:
                translate(-50%, -50%)
                scale(0.5);
        }

        .particle {
            position: fixed;

            width: 5px;
            height: 5px;

            border-radius: 50%;

            background: #00ffff;

            box-shadow:
                0 0 5px #00ffff,
                0 0 10px #00ffff,
                0 0 20px #0088ff;

            z-index: 6;

            pointer-events: none;

            animation:
                particleMove 1.3s linear forwards;
        }

        @keyframes particleMove {
            0% {
                opacity: 1;
                transform:
                    translate(0,0)
                    scale(1);
            }

            100% {
                opacity: 0;
                transform:
                    translate(
                        var(--moveX),
                        var(--moveY)
                    )
                    scale(0);
            }
        }

        #musicBtn {
            position: fixed;

            right: 20px;
            bottom: 20px;

            z-index: 20;

            padding: 12px 18px;

            border-radius: 30px;

            border: 1px solid #00ffff;

            background:
                rgba(0,0,0,0.65);

            color: white;

            cursor: pointer;

            box-shadow:
                0 0 8px #00ffff,
                inset 0 0 8px rgba(0,255,255,0.2);
        }

        .instruction {
            position: fixed;

            bottom: 25px;
            left: 50%;

            transform: translateX(-50%);

            z-index: 10;

            color: rgba(255,255,255,0.7);

            font-size: 12px;

            letter-spacing: 1px;

            text-align: center;
        }

        @media(max-width:600px) {

            .title {
                top: 18px;
                letter-spacing: 3px;
            }

            #status {
                top: 60px;
                font-size: 10px;
            }

            #gestureInfo {
                top: 82px;
                font-size: 9px;
            }

            #message {
                font-size: 35px;
                letter-spacing: 1px;
            }

            .instruction {
                bottom: 70px;
                font-size: 10px;
                width: 90%;
            }

            #musicBtn {
                right: 10px;
                bottom: 15px;
                padding: 10px 13px;
                font-size: 11px;
            }
        }
    </style>
</head>

<body>

<video
    id="video"
    autoplay
    muted
    playsinline>
</video>

<canvas id="canvas"></canvas>

<div class="overlay"></div>

<div class="title">
    MASBOW HAND MOTION
</div>

<div id="status">
    MENGAKTIFKAN KAMERA...
</div>

<div id="gestureInfo">
    Gunakan gesture tangan yang sesuai
</div>

<div id="message"></div>

<div class="instruction">
    ✋ Buat gesture tangan untuk menampilkan pesan ✨
</div>

<button id="musicBtn">
    🎵 Musik
</button>

<script>

const video = document.getElementById("video");
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

const message = document.getElementById("message");
const status = document.getElementById("status");
const gestureInfo = document.getElementById("gestureInfo");
const musicBtn = document.getElementById("musicBtn");


/* =====================================================
   CANVAS
===================================================== */

function resizeCanvas() {

    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

}

resizeCanvas();

window.addEventListener(
    "resize",
    resizeCanvas
);


/* =====================================================
   DATA PESAN + GESTURE
===================================================== */

const messages = [

    {
        text: "I LOVE YOU ❤️",
        gesture: "❤️ Bentuk LOVE dengan kedua tangan",
        type: "love"
    },

    {
        text: "YOU ARE SPECIAL ✨",
        gesture: "🖐️ Buka telapak tangan",
        type: "open"
    },

    {
        text: "KEEP SMILING 😊",
        gesture: "👍 Dua jempol ke atas",
        type: "doubleThumb"
    },

    {
        text: "NEVER GIVE UP 🔥",
        gesture: "✊ Kepalkan tangan",
        type: "fist"
    },

    {
        text: "YOU CAN DO IT ⚡",
        gesture: "👍 Jempol ke atas",
        type: "thumb"
    },

    {
        text: "STAY AWESOME 💙",
        gesture: "✌️ Buat tanda peace",
        type: "peace"
    },

    {
        text: "BELIEVE IN YOURSELF 🌟",
        gesture: "☝️ Tunjuk ke atas",
        type: "point"
    },

    {
        text: "FOLLOW YOUR DREAMS 💫",
        gesture: "☝️ Gerakkan telunjuk",
        type: "movePoint"
    }

];


let currentMessage = 0;
let lastGesture = "";
let gestureCooldown = 0;


/* =====================================================
   TAMPILKAN PESAN
===================================================== */

function showMessage(index) {

    message.textContent = messages[index].text;
    gestureInfo.textContent = messages[index].gesture;

    message.classList.remove("hide");
    message.classList.add("show");

}


/* =====================================================
   SEMBUNYIKAN PESAN
===================================================== */

function hideMessage() {

    message.classList.remove("show");

    message.classList.add("hide");

}


/* =====================================================
   PARTICLE
===================================================== */

function createParticle(x, y) {

    const particle =
        document.createElement("div");

    particle.className =
        "particle";

    particle.style.left =
        x + "px";

    particle.style.top =
        y + "px";

    particle.style.setProperty(
        "--moveX",
        ((Math.random() - 0.5) * 220) + "px"
    );

    particle.style.setProperty(
        "--moveY",
        ((Math.random() - 0.5) * 220) + "px"
    );

    document.body.appendChild(
        particle
    );

    setTimeout(() => {

        particle.remove();

    }, 1300);

}


function createParticles(
    x,
    y,
    amount = 6
) {

    for (
        let i = 0;
        i < amount;
        i++
    ) {

        createParticle(

            x +
            (Math.random() - 0.5) * 60,

            y +
            (Math.random() - 0.5) * 60

        );

    }

}


/* =====================================================
   JARAK DUA TITIK
===================================================== */

function distance(a,b) {

    return Math.sqrt(

        Math.pow(a.x-b.x,2) +

        Math.pow(a.y-b.y,2)

    );

}


/* =====================================================
   JARI TERBUKA
===================================================== */

function fingerExtended(
    landmarks,
    tip,
    pip
) {

    return (
        distance(
            landmarks[tip],
            landmarks[0]
        )
        >
        distance(
            landmarks[pip],
            landmarks[0]
        )
    );

}


/* =====================================================
   HITUNG JARI TERBUKA
===================================================== */

function countOpenFingers(hand) {

    let count = 0;

    if (
        fingerExtended(hand,8,6)
    ) count++;

    if (
        fingerExtended(hand,12,10)
    ) count++;

    if (
        fingerExtended(hand,16,14)
    ) count++;

    if (
        fingerExtended(hand,20,18)
    ) count++;

    return count;

}


/* =====================================================
   DETEKSI THUMB
===================================================== */

function thumbUp(hand) {

    const thumb =
        hand[4];

    const thumbBase =
        hand[2];

    return (
        thumb.y <
        thumbBase.y - 0.08
    );

}


/* =====================================================
   DETEKSI PEACE
===================================================== */

function isPeace(hand) {

    const index =
        fingerExtended(hand,8,6);

    const middle =
        fingerExtended(hand,12,10);

    const ring =
        fingerExtended(hand,16,14);

    const pinky =
        fingerExtended(hand,20,18);

    return (
        index &&
        middle &&
        !ring &&
        !pinky
    );

}


/* =====================================================
   DETEKSI POINT
===================================================== */

function isPoint(hand) {

    const index =
        fingerExtended(hand,8,6);

    const middle =
        fingerExtended(hand,12,10);

    const ring =
        fingerExtended(hand,16,14);

    const pinky =
        fingerExtended(hand,20,18);

    return (
        index &&
        !middle &&
        !ring &&
        !pinky
    );

}


/* =====================================================
   DETEKSI LOVE
===================================================== */

function isLove(
    handsList
) {

    if (
        handsList.length < 2
    ) {

        return false;

    }

    const hand1 =
        handsList[0];

    const hand2 =
        handsList[1];


    const thumb1 =
        hand1[4];

    const thumb2 =
        hand2[4];

    const index1 =
        hand1[8];

    const index2 =
        hand2[8];


    const thumbDistance =
        distance(
            thumb1,
            thumb2
        );


    const indexDistance =
        distance(
            index1,
            index2
        );


    /*
       Kedua ibu jari dan
       kedua telunjuk harus
       saling berdekatan.
    */

    const indexThumb1 = distance(hand1[8], hand1[4]);
    const indexThumb2 = distance(hand2[8], hand2[4]);

    return (
        thumbDistance < 0.28 &&
        indexDistance < 0.28 &&
        indexThumb1 < 0.45 &&
        indexThumb2 < 0.45
    );

}


/* =====================================================
   DETEKSI KEPALAN TANGAN
===================================================== */

function isFist(hand) {

    const index = fingerExtended(hand,8,6);
    const middle = fingerExtended(hand,12,10);
    const ring = fingerExtended(hand,16,14);
    const pinky = fingerExtended(hand,20,18);

    return !index && !middle && !ring && !pinky;

}


/* =====================================================
   DETEKSI DUA JEMPOL
===================================================== */

function isDoubleThumb(handsList) {

    return (
        handsList.length >= 2 &&
        thumbUp(handsList[0]) &&
        thumbUp(handsList[1])
    );

}


/* =====================================================
   DETEKSI GESTURE
===================================================== */

function detectGesture(
    handsList
) {

    const now =
        Date.now();


    if (
        now < gestureCooldown
    ) {

        return;

    }


    /* =============================================
       LOVE
    ============================================= */

    if (
        isLove(handsList)
    ) {

        triggerGesture(
            "love"
        );

        return;

    }


    if (
        handsList.length === 0
    ) {

        return;

    }


    const hand =
        handsList[0];


    const open =
        countOpenFingers(hand);


    const thumb =
        thumbUp(hand);


    const peace =
        isPeace(hand);


    const point =
        isPoint(hand);


    /* =============================================
       DUA JEMPOL
    ============================================= */

    if (isDoubleThumb(handsList)) {

        triggerGesture("doubleThumb");

        return;

    }


    /* =============================================
       KEPALAN TANGAN
    ============================================= */

    if (isFist(hand)) {

        triggerGesture("fist");

        return;

    }


    /* =============================================
       TELAPAK TERBUKA
    ============================================= */

    if (
        open >= 4
    ) {

        triggerGesture(
            "open"
        );

        return;

    }


    /* =============================================
       PEACE
    ============================================= */

    if (peace) {

        triggerGesture(
            "peace"
        );

        return;

    }


    /* =============================================
       THUMB UP
    ============================================= */

    if (
        thumb &&
        open <= 1
    ) {

        triggerGesture(
            "thumb"
        );

        return;

    }


    /* =============================================
       POINT
    ============================================= */

    if (point) {

        triggerGesture(
            "point"
        );

    }

}


/* =====================================================
   AKSI GESTURE
===================================================== */

function triggerGesture(
    gesture
) {

    if (
        gesture === lastGesture
    ) {

        return;

    }


    lastGesture =
        gesture;


    gestureCooldown =
        Date.now() + 1200;


    const index =
        messages.findIndex(
            item =>
                item.type === gesture
        );


    if (
        index === -1
    ) {

        return;

    }


    currentMessage =
        index;


    showMessage(
        index
    );


    status.textContent =
        "✨ GESTURE TERDETEKSI";


    createParticles(
        canvas.width / 2,
        canvas.height / 2,
        20
    );

}


/* =====================================================
   MEDIAPIPE
===================================================== */

const hands =
    new Hands({

        locateFile:
            function(file) {

                return (
                    "https://cdn.jsdelivr.net/npm/@mediapipe/hands/" +
                    file
                );

            }

    });


hands.setOptions({

    maxNumHands: 2,

    modelComplexity: 1,

    minDetectionConfidence: 0.6,

    minTrackingConfidence: 0.6

});


/* =====================================================
   HASIL HAND TRACKING
===================================================== */

hands.onResults(
    function(results) {

        ctx.clearRect(
            0,
            0,
            canvas.width,
            canvas.height
        );


        if (
            results.image
        ) {

            ctx.drawImage(

                results.image,

                0,
                0,

                canvas.width,
                canvas.height

            );

        }


        const handList =
            results.multiHandLandmarks || [];


        if (
            handList.length > 0
        ) {

            status.textContent =
                "✋ GERAKKAN TANGAN SESUAI PETUNJUK";

            status.style.color =
                "#00ffff";


            for (
                const landmarks
                of handList
            ) {

                drawConnectors(

                    ctx,

                    landmarks,

                    HAND_CONNECTIONS,

                    {
                        color: "#00ffff",
                        lineWidth: 4
                    }

                );


                drawLandmarks(

                    ctx,

                    landmarks,

                    {
                        color: "#ffffff",
                        fillColor: "#00ffff",
                        lineWidth: 2,
                        radius: 5
                    }

                );


                const finger =
                    landmarks[8];


                const x =
                    finger.x *
                    canvas.width;


                const y =
                    finger.y *
                    canvas.height;


                ctx.beginPath();

                ctx.arc(
                    x,
                    y,
                    18,
                    0,
                    Math.PI * 2
                );

                ctx.strokeStyle =
                    "#00ffff";

                ctx.lineWidth = 3;

                ctx.shadowColor =
                    "#00ffff";

                ctx.shadowBlur = 25;

                ctx.stroke();

                ctx.shadowBlur = 0;


                createParticles(
                    x,
                    y,
                    2
                );

            }


            detectGesture(
                handList
            );

        }

        else {

            status.textContent =
                "👋 Tunjukkan tangan ke kamera";

            status.style.color =
                "#ffffff";

            lastGesture = "";

            hideMessage();

        }

    }
);


/* =====================================================
   CAMERA
===================================================== */

const camera =
    new Camera(

        video,

        {

            onFrame:
                async function() {

                    await hands.send({
                        image: video
                    });

                },

            width: 1280,

            height: 720

        }

    );


async function startCamera() {

    try {

        await navigator
            .mediaDevices
            .getUserMedia({
                video: true
            })
            .then(
                stream => {

                    stream
                        .getTracks()
                        .forEach(
                            track =>
                                track.stop()
                        );

                }
            );


        camera.start();


        status.textContent =
            "KAMERA AKTIF";


    }

    catch(error) {

        console.error(error);

        status.textContent =
            "❌ IZINKAN KAMERA";

        status.style.color =
            "#ff4444";

    }

}


startCamera();


/* =====================================================
   MUSIK
===================================================== */

const music =
    new Audio("musik.mp3");

music.loop = true;
music.volume = 0.7;
music.preload = "auto";


/*
   Browser akan mencoba memainkan
   musik ketika halaman selesai dimuat.
*/

async function startMusic() {

    try {

        await music.play();

        musicBtn.textContent =
            "⏸️ Musik Aktif";

    }

    catch(error) {

        console.log(
            "Browser memblokir autoplay:",
            error
        );

        musicBtn.textContent =
            "🎵 Klik untuk Musik";

    }

}


/* =====================================================
   AUTOPLAY
===================================================== */

window.addEventListener(
    "load",
    function() {

        startMusic();

    }
);


/* =====================================================
   FALLBACK INTERAKSI
===================================================== */

document.addEventListener(
    "click",
    function() {

        if (
            music.paused
        ) {

            startMusic();

        }

    }
);


/* =====================================================
   TOMBOL MUSIK
===================================================== */

musicBtn.addEventListener(
    "click",
    function(event) {

        event.stopPropagation();


        if (
            music.paused
        ) {

            startMusic();

        }

        else {

            music.pause();

            musicBtn.textContent =
                "🎵 Putar Musik";

        }

    }
);

</script>

</body>
</html>
